<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sans Dodging Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Press Start 2P', monospace;
            background-color: #000;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .game-container {
            width: 600px;
            height: 500px;
            background-color: #000;
            border: 4px solid #fff;
            border-radius: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background-color: #000;
            font-size: 20px;
            font-weight: bold;
        }

        .game-area {
            position: relative;
            height: 400px;
            background-color: #000;
            overflow: hidden;
            border: 2px solid #fff;
            margin: 5px;
        }

        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            z-index: 10;
            opacity: 0;
            transition: none;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #sans {
            position: absolute;
            top: -120px;
            right: 50px;
            width: 200px;
            height: auto;
            z-index: 3;
        }

        #sans img {
            width: 100%;
            height: auto;
            image-rendering: pixelated;
        }

        #player {
            position: absolute;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        #player img {
            width: 30px;
            height: 30px;
            image-rendering: pixelated;
        }

        .bone {
            position: absolute;
            z-index: 4;
        }

        .bone img {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        .blue-bone {
            filter: hue-rotate(240deg) brightness(1.5);
        }

        .gaster-blaster {
            position: absolute;
            z-index: 4;
        }

        .gaster-blaster img {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        .laser {
            position: absolute;
            background: linear-gradient(90deg, 
                transparent 0%,
                rgba(0, 255, 255, 0.3) 20%,
                #00ffff 40%,
                #ffffff 50%,
                #00ffff 60%,
                rgba(0, 255, 255, 0.3) 80%,
                transparent 100%
            );
            z-index: 5;
            box-shadow: 0 0 20px #00ffff;
            animation: laserPulse 0.2s infinite;
        }

        @keyframes laserPulse {
            0%, 100% { opacity: 0.9; }
            50% { opacity: 1; }
        }

        .item-button {
            position: absolute;
            z-index: 5;
            animation: itemGlow 2s infinite;
        }

        .item-button img {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        @keyframes itemGlow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.5); }
        }

        .warning {
            position: absolute;
            color: #ffff00;
            font-size: 24px;
            z-index: 6;
            animation: warningBlink 0.5s infinite;
        }

        @keyframes warningBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .controls {
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #000;
        }

        #start-btn {
            padding: 8px 15px;
            background-color: #333;
            color: white;
            border: 2px solid #fff;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
        }

        #start-btn:hover {
            background-color: #555;
        }

        .message {
            font-size: 16px;
            color: #fff;
            font-weight: bold;
            padding-left: 15px;
        }

        .health {
            font-size: 20px;
            font-weight: bold;
        }

        @keyframes flash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .flashing {
            animation: flash 0.5s infinite;
        }

        .shake {
            animation: battleShake 0.3s ease-in-out;
        }

        @keyframes battleShake {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(-3px, -2px); }
            75% { transform: translate(3px, 2px); }
        }

        .damage-number {
            position: absolute;
            color: #ff4444;
            font-size: 14px;
            font-weight: bold;
            z-index: 120;
            animation: damageFloat 1s ease-out forwards;
            pointer-events: none;
        }

        @keyframes damageFloat {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-30px); }
        }

        .heal-number {
            position: absolute;
            color: #44ff44;
            font-size: 14px;
            font-weight: bold;
            z-index: 120;
            animation: damageFloat 1s ease-out forwards;
            pointer-events: none;
        }

        #musicControls {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 200;
        }

        #musicToggle {
            background: #333;
            color: white;
            border: 1px solid #666;
            padding: 5px 10px;
            font-family: inherit;
            font-size: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="hud">
            <div class="score">Score: <span id="score">0</span></div>
            <div class="health">HP: <span id="health">20</span> KR: <span id="karma">0</span></div>
        </div>
        <div class="game-area">
            <div id="player">
                <img src="SOUL2.png" alt="Soul">
            </div>
            <div id="gameOverScreen">
                <div style="font-size: 24px; color: #ff4444; margin-bottom: 20px;">* You died.</div>
                <div style="font-size: 14px; margin: 10px 0;">Puntuación: <span id="finalScore">0</span></div>
                <div style="font-size: 12px; opacity: 0.8;">"nah, i'm rootin' for ya, kid."</div>
                <button onclick="resetGame()" style="margin-top: 15px; padding: 8px 16px; background: #333; color: white; border: 2px solid #666; cursor: pointer; font-family: inherit; font-size: 10px;">* Continue</button>
            </div>
        </div>
        <div class="controls">
            <button id="start-btn">Start Game</button>
            <div class="message" id="message">Presiona WASD para moverte. Esquiva los huesos!</div>
        </div>
    </div>
    
    <div id="sans">
        <img src="Tenor-unscreen.gif" alt="Sans">
    </div>
    
    <div id="musicControls">
        <button id="musicToggle">♪ Música</button>
    </div>
    
    <audio id="bgMusic" loop>
        <source src="1-13 Megalovania.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Variables del juego
        let gameRunning = false;
        let playerHealth = 20;
        let score = 0;
        let karma = 0;
        let bones = [];
        let items = [];
        let playerX = 275;
        let playerY = 200;
        let lastPlayerX = 275;
        let lastPlayerY = 200;
        let isPlayerMoving = false;
        const playerSpeed = 4;
        let boneInterval;
        let scoreInterval;
        let difficulty = 1;
        let invulnerable = false;
        let invulnerabilityTimer = 0;
        let musicEnabled = true;

        // Elementos DOM
        const player = document.getElementById('player');
        const gameArea = document.querySelector('.game-area');
        const startBtn = document.getElementById('start-btn');
        const scoreDisplay = document.getElementById('score');
        const healthDisplay = document.getElementById('health');
        const karmaDisplay = document.getElementById('karma');
        const messageDisplay = document.getElementById('message');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreDisplay = document.getElementById('finalScore');
        const sansElement = document.getElementById('sans');
        const bgMusic = document.getElementById('bgMusic');
        const musicToggle = document.getElementById('musicToggle');

        // Controles
        const keys = {};

        document.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            
            if ((e.key.toLowerCase() === 'z' || e.key === 'Enter') && gameRunning) {
                checkItemCollection();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        // Inicializar posición del jugador
        player.style.left = playerX + 'px';
        player.style.top = playerY + 'px';

        // Event listeners
        startBtn.addEventListener('click', function() {
            if (startBtn.textContent === 'RESET') {
                location.reload();
            } else {
                startGame();
            }
        });

        musicToggle.addEventListener('click', function() {
            toggleMusic();
        });

        function toggleMusic() {
            musicEnabled = !musicEnabled;
            if (musicEnabled) {
                bgMusic.play().catch(e => console.log("No se pudo reproducir música:", e));
                musicToggle.textContent = '♪ ON';
            } else {
                bgMusic.pause();
                musicToggle.textContent = '♪ OFF';
            }
        }

        function startGame() {
            if (gameRunning) return;
            
            resetGame();
            gameRunning = true;
            startBtn.textContent = 'RESET';
            messageDisplay.innerHTML = "* don't get hit by the bones!";
            
            // Música
            if (musicEnabled) {
                bgMusic.volume = 0.3;
                bgMusic.play().catch(e => console.log("No se pudo reproducir música:", e));
            }
            
            requestAnimationFrame(gameLoop);
            boneInterval = setInterval(createBone, 1200);
            scoreInterval = setInterval(() => {
                score += 10;
                scoreDisplay.textContent = score;
                difficulty = Math.floor(score / 500) + 1;
            }, 1000);
            
            sansElement.classList.add('flashing');
        }

        function resetGame() {
            // Limpiar huesos
            bones.forEach(bone => {
                if (bone.element && bone.element.parentNode) {
                    bone.element.remove();
                }
            });
            bones = [];
            
            // Limpiar ítems
            items.forEach(item => {
                if (item.element && item.element.parentNode) {
                    item.element.remove();
                }
            });
            items = [];
            
            // Limpiar elementos restantes
            const cleanup = gameArea.querySelectorAll('.bone, .item-button, .gaster-blaster, .laser, .warning, .damage-number, .heal-number');
            cleanup.forEach(el => {
                if (el && el.parentNode) {
                    el.remove();
                }
            });
            
            playerHealth = 20;
            score = 0;
            karma = 0;
            playerX = 275;
            playerY = 200;
            difficulty = 1;
            invulnerable = false;
            
            player.style.left = playerX + 'px';
            player.style.top = playerY + 'px';
            player.style.filter = '';
            healthDisplay.textContent = playerHealth;
            karmaDisplay.textContent = karma;
            scoreDisplay.textContent = score;
            
            gameOverScreen.style.display = 'none';
        }

        function gameLoop() {
            if (!gameRunning) return;
            
            // Detectar movimiento
            isPlayerMoving = (playerX !== lastPlayerX || playerY !== lastPlayerY);
            lastPlayerX = playerX;
            lastPlayerY = playerY;
            
            movePlayer();
            moveBones();
            moveItems();
            checkCollisions();
            
            // Manejar invulnerabilidad
            if (invulnerable) {
                invulnerabilityTimer -= 16;
                if (invulnerabilityTimer <= 0) {
                    invulnerable = false;
                    player.classList.remove('flashing');
                }
            }
            
            // Aplicar daño por karma
            if (karma > 0 && score % 180 === 0) {
                karma = Math.max(0, karma - 1);
                if (playerHealth > 1) {
                    playerHealth = Math.max(1, playerHealth - 1);
                    healthDisplay.textContent = playerHealth;
                    karmaDisplay.textContent = karma;
                    showNumber(playerX, playerY, '-1', '#ff00ff');
                }
            }
            
            if (gameRunning) {
                requestAnimationFrame(gameLoop);
            }
        }

        function movePlayer() {
            if (keys['arrowup'] || keys['w']) {
                playerY = Math.max(0, playerY - playerSpeed);
            }
            if (keys['arrowdown'] || keys['s']) {
                playerY = Math.min(gameArea.clientHeight - player.clientHeight, playerY + playerSpeed);
            }
            if (keys['arrowleft'] || keys['a']) {
                playerX = Math.max(0, playerX - playerSpeed);
            }
            if (keys['arrowright'] || keys['d']) {
                playerX = Math.min(gameArea.clientWidth - player.clientWidth, playerX + playerSpeed);
            }
            
            player.style.left = playerX + 'px';
            player.style.top = playerY + 'px';
        }

        function createBone() {
            if (!gameRunning) return;
            
            // Chance de crear ítem en lugar de hueso
            if (Math.random() < 0.2) {
                createItem();
                return;
            }
            
            const isBlue = Math.random() < 0.3;
            const bone = document.createElement('div');
            bone.className = isBlue ? 'bone blue-bone' : 'bone';
            
            const boneImg = document.createElement('img');
            boneImg.src = isBlue ? 'blue-bone-removebg-preview.png' : '4t8yv2.webp';
            boneImg.style.width = '100%';
            boneImg.style.height = '100%';
            bone.appendChild(boneImg);
            
            let boneX, boneY, width, height, speedX, speedY;
            
            const fromTop = Math.random() < 0.5;
            const size = 30 + Math.random() * 20;
            const speed = 2 + difficulty * 0.5;
            
            if (fromTop) {
                width = size * 1.5;
                height = size;
                boneX = Math.random() * (gameArea.clientWidth - width);
                boneY = Math.random() < 0.5 ? -height : gameArea.clientHeight;
                speedX = 0;
                speedY = boneY < 0 ? speed : -speed;
                boneImg.style.transform = 'rotate(90deg)';
            } else {
                width = size;
                height = size * 1.5;
                boneX = Math.random() < 0.5 ? -width : gameArea.clientWidth;
                boneY = Math.random() * (gameArea.clientHeight - height);
                speedX = boneX < 0 ? speed : -speed;
                speedY = 0;
                boneImg.style.transform = 'rotate(0deg)';
            }
            
            bone.style.width = width + 'px';
            bone.style.height = height + 'px';
            bone.style.left = boneX + 'px';
            bone.style.top = boneY + 'px';
            
            gameArea.appendChild(bone);
            
            bones.push({
                element: bone,
                x: boneX,
                y: boneY,
                width,
                height,
                speedX,
                speedY,
                isBlue
            });
        }

        function createItem() {
            const item = document.createElement('div');
            item.className = 'item-button';
            
            const itemImg = document.createElement('img');
            itemImg.src = 'item.png';
            itemImg.style.width = '100%';
            itemImg.style.height = '100%';
            item.appendChild(itemImg);
            
            const x = Math.random() * (gameArea.clientWidth - 40);
            const y = Math.random() * (gameArea.clientHeight - 40);
            
            item.style.width = '40px';
            item.style.height = '40px';
            item.style.left = x + 'px';
            item.style.top = y + 'px';
            
            gameArea.appendChild(item);
            
            items.push({
                element: item,
                x: x,
                y: y,
                width: 40,
                height: 40,
                lifetime: 0
            });
        }

        function moveBones() {
            for (let i = bones.length - 1; i >= 0; i--) {
                const bone = bones[i];
                bone.x += bone.speedX;
                bone.y += bone.speedY;
                
                bone.element.style.left = bone.x + 'px';
                bone.element.style.top = bone.y + 'px';
                
                if (bone.x < -bone.width * 2 || 
                    bone.x > gameArea.clientWidth + bone.width || 
                    bone.y < -bone.height * 2 || 
                    bone.y > gameArea.clientHeight + bone.height) {
                    
                    if (bone.element && bone.element.parentNode) {
                        bone.element.remove();
                    }
                    bones.splice(i, 1);
                }
            }
        }

        function moveItems() {
            for (let i = items.length - 1; i >= 0; i--) {
                const item = items[i];
                item.lifetime += 16;
                
                if (item.lifetime > 8000) {
                    if (item.element && item.element.parentNode) {
                        item.element.remove();
                    }
                    items.splice(i, 1);
                }
            }
        }

        function checkItemCollection() {
            const playerRect = {
                x: playerX + 10,
                y: playerY + 10,
                width: 30,
                height: 30
            };
            
            for (let i = items.length - 1; i >= 0; i--) {
                const item = items[i];
                const distance = Math.sqrt(
                    Math.pow(playerRect.x - item.x, 2) + Math.pow(playerRect.y - item.y, 2)
                );
                
                if (distance < 40) {
                    const healAmount = 5 + Math.floor(Math.random() * 8);
                    playerHealth = Math.min(20, playerHealth + healAmount);
                    karma = Math.max(0, karma - Math.floor(healAmount / 2));
                    
                    healthDisplay.textContent = playerHealth;
                    karmaDisplay.textContent = karma;
                    
                    showNumber(playerX, playerY, `+${healAmount}`, '#44ff44');
                    messageDisplay.innerHTML = `* Recuperaste ${healAmount} HP!`;
                    
                    if (item.element && item.element.parentNode) {
                        item.element.remove();
                    }
                    items.splice(i, 1);
                    break;
                }
            }
        }

        function checkCollisions() {
            if (invulnerable) return;
            
            const playerRect = {
                x: playerX + 10,
                y: playerY + 10,
                width: 30,
                height: 30
            };
            
            for (let i = bones.length - 1; i >= 0; i--) {
                const bone = bones[i];
                const boneRect = {
                    x: bone.x,
                    y: bone.y,
                    width: bone.width,
                    height: bone.height
                };
                
                if (playerRect.x < boneRect.x + boneRect.width &&
                    playerRect.x + playerRect.width > boneRect.x &&
                    playerRect.y < boneRect.y + boneRect.height &&
                    playerRect.y + playerRect.height > boneRect.y) {
                    
                    if (bone.isBlue && !isPlayerMoving) {
                        continue;
                    }
                    
                    takeDamage();
                    break;
                }
            }
        }

        function takeDamage() {
            playerHealth -= 1;
            karma += 1;
            invulnerable = true;
            invulnerabilityTimer = 1000;
            
            healthDisplay.textContent = playerHealth;
            karmaDisplay.textContent = karma;
            
            player.classList.add('flashing');
            gameArea.classList.add('shake');
            
            showNumber(playerX, playerY, '-1', '#ff4444');
            
            setTimeout(() => {
                gameArea.classList.remove('shake');
            }, 300);
            
            if (playerHealth <= 0) {
                endGame();
            }
        }

        function showNumber(x, y, text, color) {
            const numberEl = document.createElement('div');
            numberEl.className = color === '#44ff44' ? 'heal-number' : 'damage-number';
            numberEl.textContent = text;
            numberEl.style.left = (x + 15) + 'px';
            numberEl.style.top = (y - 5) + 'px';
            numberEl.style.color = color;
            gameArea.appendChild(numberEl);
            
            setTimeout(() => {
                if (numberEl && numberEl.parentNode) {
                    numberEl.remove();
                }
            }, 1000);
        }

        function endGame() {
            gameRunning = false;
            clearInterval(boneInterval);
            clearInterval(scoreInterval);
            
            if (bgMusic) {
                bgMusic.pause();
            }
            
            finalScoreDisplay.textContent = score;
            gameOverScreen.style.display = 'flex';
            gameOverScreen.style.opacity = '1';
            
            messageDisplay.innerHTML = `* game over! Final score: ${score}`;
            startBtn.textContent = 'RESET';
            
            sansElement.classList.remove('flashing');
        }

        // Inicializar
        healthDisplay.textContent = playerHealth;
        karmaDisplay.textContent = karma;
        scoreDisplay.textContent = score;
    </script>
</body>
</html>
